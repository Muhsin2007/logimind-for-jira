modules:
  jira:globalPage:
    - key: logimind-global-page
      resource: main
      resolver:
        function: resolver
      title: LogiMind
  jira:issueContext:
    - key: logimind-issue-context
      resource: main
      resolver:
        function: resolver
      title: LogiMind
      label: LogiMind risk
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/app/build
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/0c416234-e118-4454-907e-04c39eaa2c70
permissions:
  scopes:
    - storage:app
    # ADMINISTER check (mypermissions), project/issue-type lists, issue status search.
    - read:jira-work
    # Creating an issue from a risk, as the user who clicks "Create Jira issue".
    - write:jira-work
