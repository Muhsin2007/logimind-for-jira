modules:
  jira:globalPage:
    - key: logimind-global-page
      resource: main
      resolver:
        function: resolver
      title: LogiMind
  jira:issueContext:
    - key: logimind-issue-context
      resource: main
      resolver:
        function: resolver
      title: LogiMind
      label: LogiMind risk
  rovo:agent:
    - key: logimind-agent
      name: LogiMind
      description: Read-only logistics risk assistant. Summarises shipment and stock risks, looks up shipments, inventory and linked Jira issues from LogiMind data.
      prompt: resource:agent-prompt;prompt.txt
      conversationStarters:
        - Give me today's logistics risk summary
        - What is the status of shipment SHP-1004?
        - Which SKUs are below safety stock?
        - Is there a Jira issue for the most critical risk?
      actions:
        - get-risk-summary
        - get-shipment
        - get-inventory
        - get-linked-jira-issue
        - simulate-delay
  action:
    - key: get-risk-summary
      name: Get logistics risk summary
      function: agentRiskSummary
      actionVerb: GET
      description: Returns open logistics risks from LogiMind's deterministic rules - counts by severity and the most severe matching risks (risk IDs, types, numeric evidence) with the data date. Use riskType LOW_STOCK to list SKUs below safety stock.
      inputs:
        severity:
          title: Severity
          type: string
          required: false
          description: Optional filter - critical, high, medium or low.
        riskType:
          title: Risk type
          type: string
          required: false
          description: Optional filter - LATE_SHIPMENT, ETA_SLIP, MISSING_ETA or LOW_STOCK.
        limit:
          title: Number of risks
          type: integer
          required: false
          description: How many of the most severe risks to return (1-10, default 5).
    - key: get-shipment
      name: Get shipment
      function: agentShipment
      actionVerb: GET
      description: Returns stored facts for one shipment ID - status, quantities, planned arrival, ETA, its risks with any linked Jira issue, and stock at the destination warehouse. Returns found false if the ID does not exist.
      inputs:
        shipmentId:
          title: Shipment ID
          type: string
          required: true
          description: The exact shipment ID from LogiMind, e.g. SHP-1004.
    - key: get-inventory
      name: Get inventory
      function: agentInventory
      actionVerb: GET
      description: Returns stock positions for a SKU (on hand, reserved, available, inbound within 7 days, projected, safety stock) and any low-stock risk, optionally for one warehouse.
      inputs:
        sku:
          title: SKU
          type: string
          required: true
          description: The exact SKU from LogiMind, e.g. SKU-04.
        warehouse:
          title: Warehouse
          type: string
          required: false
          description: Optional warehouse name to filter by.
    - key: get-linked-jira-issue
      name: Get linked Jira issue
      function: agentLinkedIssue
      actionVerb: GET
      description: Returns the Jira issue created from a LogiMind risk and its current status, if one exists and the user can see it. Only use a riskId returned by another LogiMind action.
      inputs:
        riskId:
          title: Risk ID
          type: string
          required: true
          description: A risk ID exactly as returned by another LogiMind action, e.g. LATE_SHIPMENT:SHP-1004.
    - key: simulate-delay
      name: Simulate shipment delay
      function: agentSimulateDelay
      actionVerb: GET
      description: Read-only what-if. Shows how stock positions change if one shipment, or every upcoming shipment of a supplier, arrives delayDays later - low-stock severity, days of cover and projected stock-out date, today versus with the delay. Nothing is saved.
      inputs:
        shipmentId:
          title: Shipment ID
          type: string
          required: false
          description: The exact shipment ID to delay, e.g. SHP-1001. Give this or supplier.
        supplier:
          title: Supplier
          type: string
          required: false
          description: Supplier name, to delay all of its open upcoming shipments.
        delayDays:
          title: Delay in days
          type: integer
          required: true
          description: Whole number of days from 1 to 30.
  # Atlassian-hosted Claude (Forge LLMs): AI column mapping and the AI Copilot. No external provider.
  llm:
    - key: logimind-llm
      model:
        - claude
  function:
    - key: resolver
      handler: index.handler
    - key: agentRiskSummary
      handler: index.agentRiskSummary
    - key: agentShipment
      handler: index.agentShipment
    - key: agentInventory
      handler: index.agentInventory
    - key: agentLinkedIssue
      handler: index.agentLinkedIssue
    - key: agentSimulateDelay
      handler: index.agentSimulateDelay
resources:
  - key: main
    path: static/app/build
  - key: agent-prompt
    path: static/agent
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/0c416234-e118-4454-907e-04c39eaa2c70
permissions:
  scopes:
    - storage:app
    # ADMINISTER check (mypermissions), project/issue-type lists, issue status search.
    - read:jira-work
    # Creating an issue from a risk, as the user who clicks "Create Jira issue".
    - write:jira-work
